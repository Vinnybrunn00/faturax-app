name: faturax_app
description: "A new Flutter project."

publish_to: "none"

version: 1.0.22

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  firebase_auth: ^7.1.0
  intl: ^0.20.3
  provider: ^6.1.5+1
  cloud_firestore: ^7.2.0
  currency_text_input_formatter: ^2.3.3
  firebase_core: ^5.2.0
  google_fonts: ^9.0.0
  iconsx_plus: ^2.0.0
  shorebird_code_push: ^2.0.7
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  process_run: ^1.4.4+1
  yaml: ^3.1.4
  firebase_admin_sdk: ^0.5.6
  material_ui: ^1.11.1

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/image.png"
  min_sdk_android: 23
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/image.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - shorebird.yaml
